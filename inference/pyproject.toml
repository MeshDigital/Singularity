[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-inference"
version = "0.1.0"
description = "Singularity's AI song-creation worker: stem separation, lyric alignment and pitch tracking over a JSONL protocol."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["singularity_inference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
