# Singularity Essentia profile — key detection only.
# Passed to essentia_streaming_extractor_music by EssentiaRunner. KeyDetectionService reads the
# tonal key_edma / key_krumhansl results; no TensorFlow models are loaded.

outputFormat: json
indent: 4
outputFrames: 0
sampleRate: 44100
startTime: 0
endTime: 600
analyzeSegments: false

lowlevel:
    frameSize: 2048
    hopSize: 1024

tonal:
    frameSize: 4096
    hopSize: 2048

highlevel:
    compute: false
